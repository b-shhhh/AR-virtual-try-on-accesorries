        <circle cx="29" cy="39" r="6"/>
      </g>
    </g>
    <g transform="translate(180 148)">
      <circle cy="-38" r="9" fill="url(#pearl)" stroke="#d4a23c" stroke-width="3"/>
      <path d="M0-27v24" stroke="url(#gold)" stroke-width="5"/>
      <ellipse cy="26" rx="34" ry="47" stroke="url(#gold)" stroke-width="9"/>
      <g fill="url(#pearl)" stroke="#d4a23c" stroke-width="2">
        <circle cx="-29" cy="39" r="6"/>
        <circle cx="-13" cy="67" r="6"/>
        <circle cx="13" cy="67" r="6"/>
        <circle cx="29" cy="39" r="6"/>
      </g>
    </g>
