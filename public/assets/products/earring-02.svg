<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-labelledby="title desc">
  <title id="title">Earring 02</title>
  <desc id="desc">A pair of gold hoop earrings with white pearls.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff0a6"/>
      <stop offset=".55" stop-color="#d4a23c"/>
      <stop offset="1" stop-color="#8d5c22"/>
    </linearGradient>
    <radialGradient id="pearl" cx="35%" cy="28%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f4eadc"/>
      <stop offset="1" stop-color="#c9b8a5"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke-linecap="round">
    <g transform="translate(60 148)">
