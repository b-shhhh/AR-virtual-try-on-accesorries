    async function seedFirestore() {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      
      document.getElementById('status').innerHTML = 'Seeding products to Firestore...';
      
      for (const model of modelCatalog) {
        try {
          // Determine placement based on category
          const placement = model.category === "sunglasses" ? "eyes" : "ears";
          
          const productData = {
            id: model.id,
            name: model.name,
            category: model.category,
            price: model.price,
            currency: "NPR",
            description: model.description,
            modelUrl: `/3d models/${model.modelFile}`,
            thumbnailUrl: `https://source.unsplash.com/800x800/?${model.category},jewelry,product`,
            tryOnImageUrl: `/3d models/${model.modelFile}`,
            arSupported: true,
            placement: placement,
            createdAt: serverTimestamp()
          };

          await setDoc(doc(db, "products", model.id), productData);
          document.getElementById('status').innerHTML += `<br>✓ Added: ${model.name}`;
        } catch (error) {
          document.getElementById('status').innerHTML += `<br>✗ Error: ${model.name} - ${error.message}`;
        }
      }
      
      document.getElementById('status').innerHTML += '<br><br>Done! Check your Firestore database.';
    }

    window.seedFirestore = seedFirestore;
