<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Classic gold choker</title>
  <desc id="desc">Original product render of a layered gold choker with small pearls.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff1a9"/>
      <stop offset="0.48" stop-color="#c88d1e"/>
      <stop offset="1" stop-color="#f5cf68"/>
    </linearGradient>
    <radialGradient id="pearl" cx="35%" cy="25%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dec391"/>
    </radialGradient>
  </defs>
  <rect width="640" height="640" rx="56" fill="#f8fbff"/>
  <g filter="drop-shadow(0 16px 20px rgba(77,55,14,.2))">
    <path d="M122 270c72 84 324 84 396 0" fill="none" stroke="url(#gold)" stroke-width="30" stroke-linecap="round"/>
    <path d="M144 312c68 70 284 70 352 0" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
    <path d="M168 350c58 48 246 48 304 0" fill="none" stroke="#ffe596" stroke-width="7" stroke-linecap="round"/>
    <g fill="url(#pearl)" stroke="url(#gold)" stroke-width="5">
      <circle cx="214" cy="356" r="13"/>
      <circle cx="268" cy="371" r="13"/>
      <circle cx="320" cy="376" r="14"/>
      <circle cx="372" cy="371" r="13"/>
      <circle cx="426" cy="356" r="13"/>
    </g>
  </g>
</svg>
