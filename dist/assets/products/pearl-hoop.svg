<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Pearl hoop earrings</title>
  <desc id="desc">Original product render of gold hoop earrings with pearl drops.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff2b3"/>
      <stop offset="0.45" stop-color="#c99225"/>
      <stop offset="1" stop-color="#f4cf64"/>
    </linearGradient>
    <radialGradient id="pearl" cx="34%" cy="26%" r="74%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f8ead2"/>
      <stop offset="1" stop-color="#d4b88a"/>
    </radialGradient>
  </defs>
  <rect width="640" height="640" rx="56" fill="#fff9f1"/>
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" filter="drop-shadow(0 16px 18px rgba(80,46,8,.22))">
    <g transform="translate(200 142)">
      <circle cx="0" cy="0" r="20" fill="url(#pearl)" stroke="url(#gold)" stroke-width="8"/>
      <path d="M0 28c-64 18-82 96-45 146 36 50 114 38 134-22 15-46-10-101-62-117" stroke-width="22"/>
      <circle cx="18" cy="228" r="37" fill="url(#pearl)" stroke="url(#gold)" stroke-width="8"/>
    </g>
    <g transform="translate(440 142)">
      <circle cx="0" cy="0" r="20" fill="url(#pearl)" stroke="url(#gold)" stroke-width="8"/>
      <path d="M0 28c-64 18-82 96-45 146 36 50 114 38 134-22 15-46-10-101-62-117" stroke-width="22"/>
      <circle cx="18" cy="228" r="37" fill="url(#pearl)" stroke="url(#gold)" stroke-width="8"/>
    </g>
  </g>
