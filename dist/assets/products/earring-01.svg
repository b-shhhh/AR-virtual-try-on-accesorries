<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-labelledby="title desc">
  <title id="title">Earring 01</title>
  <desc id="desc">A pair of gold crescent earrings with pink stones.</desc>
  <defs>
