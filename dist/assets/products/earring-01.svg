      <path d="M-22 2a22 22 0 0 0 44 0" stroke="#fff1a8" stroke-width="3" opacity=".7"/>
      <path d="M-28 35c12 20 44 20 56 0" stroke="url(#gold)" stroke-width="8"/>
      <g fill="url(#rose)" stroke="#f7d66b" stroke-width="2">
        <circle cx="-25" cy="45" r="5"/>
        <circle cx="-9" cy="51" r="5"/>
        <circle cx="9" cy="51" r="5"/>
        <circle cx="25" cy="45" r="5"/>
